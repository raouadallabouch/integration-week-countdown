/* ==========================================================================
   1337 TÉTOUAN — PROMOTION 2026 COUNTDOWN
   Pure Minimalist Monolith | Deep Black Background | Ghost White Binary
   ========================================================================== */

:root {
    --promo-red: #df2635;
    --promo-red-glow: rgba(223, 38, 53, 0.2);
    --bg-black: #000000;
    --text-primary: #ffffff;
    --text-muted: #8c909b;
    --text-faint: #282a32;
    --border-light: rgba(255, 255, 255, 0.12);
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    --digit-aspect-ratio: 0.60533; /* 164.54 / 271.81 */
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-black);
    color: var(--text-primary);
    font-family: var(--font-mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
}

/* Base Body Layout */
.monolith-body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100vh;
    padding: 2.5rem 3rem;
    position: relative;
    background: var(--bg-black);
}

/* Background Falling Binary Stream Canvas */
.binary-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
}

/* ==========================================================================
   1337 MORPHING LOGO & STAGE HEADER
   ========================================================================== */
.stage-header-row {
    width: 100%;
    align-self: stretch;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: clamp(1rem, 2.5vw, 2.5rem);
}

.morph-logo {
    --logo-h: clamp(28px, 4vw, 54px);
    display: flex;
    align-items: center;
    height: var(--logo-h);
    cursor: default;
    gap: 0; /* Exact spacing controlled via official 1337 SVG metrics */
}

.morph-slot {
    height: var(--logo-h);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Exact Slot Dimensions & Spacing from Official 1337 Logo SVG (viewBox 0 0 76 20) */
/* Digit 1: width = 11.8484 / 20 = 0.59242 * H */
/* Gap 1 to 3: margin-right = 9.5301 / 20 = 0.476505 * H */
#slot0 {
    width: calc(var(--logo-h) * (11.8484 / 20));
    margin-right: calc(var(--logo-h) * (9.5301 / 20));
}

/* Digit 3: width = 12.1060 / 20 = 0.60530 * H */
/* Gap 3 to 3: margin-right = 8.7574 / 20 = 0.43787 * H */
#slot1 {
    width: calc(var(--logo-h) * (12.1060 / 20));
    margin-right: calc(var(--logo-h) * (8.7574 / 20));
}

/* Digit 3: width = 12.1060 / 20 = 0.60530 * H */
/* Gap 3 to 7: margin-right = 8.2423 / 20 = 0.412115 * H */
#slot2 {
    width: calc(var(--logo-h) * (12.1060 / 20));
    margin-right: calc(var(--logo-h) * (8.2423 / 20));
}

/* Digit 7: width = 12.6211 / 20 = 0.631055 * H */
#slot3 {
    width: calc(var(--logo-h) * (12.6211 / 20));
    margin-right: 0;
}

/* Digits inside Morph Slot */
.morph-digit {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
    will-change: transform, opacity;
}

.morph-digit svg {
    width: 100%;
    height: 100%;
    display: block;
}

.morph-digit svg path,
.morph-digit svg polygon {
    fill: #ffffff;
}

/* Tumbler Motion States */
.morph-digit.enter-down {
    transform: translateY(-105%);
    opacity: 0;
}

.morph-digit.enter-up {
    transform: translateY(105%);
    opacity: 0;
}

.morph-digit.current {
    transform: translateY(0);
    opacity: 1;
}

.morph-digit.exit-up {
    transform: translateY(-105%);
    opacity: 0;
}

.morph-digit.exit-down {
    transform: translateY(105%);
    opacity: 0;
}

/* ==========================================================================
   CENTER SUSPENSEFUL COUNTDOWN STAGE WITH BIG 'BE READY'
   ========================================================================== */
.countdown-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    z-index: 2;
}

.stage-container {
    display: inline-flex;
    flex-direction: column;
    align-items: stretch; /* Stretches header row so BE READY & 1337 frame the countdown perfectly */
    justify-content: center;
    gap: clamp(0.75rem, 1.6vw, 1.4rem);
    width: fit-content;
    max-width: 100%;
}

.stage-headline-vector {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 0;
}

.word-group {
    display: flex;
    align-items: center;
    gap: clamp(4px, 0.5vw, 8px);
}

.word-spacer {
    width: clamp(14px, 1.8vw, 28px);
}

.char-cell {
    height: clamp(28px, 4vw, 54px);
    width: calc(clamp(28px, 4vw, 54px) * var(--digit-aspect-ratio));
    display: flex;
    align-items: center;
    justify-content: center;
}

.char-cell svg {
    width: 100%;
    height: 100%;
    display: block;
}

.char-cell svg path,
.char-cell svg polygon {
    fill: #ffffff;
}

.countdown-monolith {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(0.75rem, 2vw, 2.2rem);
    max-width: 1400px;
}

.time-unit-group {
    display: flex;
    align-items: center;
    justify-content: center;
}

.digits-pair {
    display: flex;
    align-items: center;
    gap: clamp(4px, 0.8vw, 10px);
}

/* Digit Cell Container */
.digit-cell {
    height: clamp(85px, 14vw, 165px);
    width: calc(clamp(85px, 14vw, 165px) * var(--digit-aspect-ratio));
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.digit-slide-wrap {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    will-change: transform, opacity;
}

.digit-slide-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
}

.digit-slide-wrap svg path,
.digit-slide-wrap svg polygon {
    fill: #ffffff;
}

/* Sliding Transitions */
.digit-slide-wrap.entering {
    transform: translateY(105%);
    opacity: 0;
}

.digit-slide-wrap.active {
    transform: translateY(0);
    opacity: 1;
}

.digit-slide-wrap.leaving {
    transform: translateY(-105%);
    opacity: 0;
}

/* Colons Separators */
.colon-cell {
    height: clamp(85px, 14vw, 165px);
    width: calc(clamp(85px, 14vw, 165px) * 0.2307);
    display: flex;
    align-items: center;
    justify-content: center;
}

.thirteen-colon-svg {
    height: 100%;
    width: 100%;
}

.thirteen-colon-svg rect {
    fill: #ffffff;
}

/* ==========================================================================
   DISCREET BOTTOM BAR & AUTO-HIDE CONTROLS
   ========================================================================== */
.bottom-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    position: absolute;
    bottom: 2.5rem;
    left: 0;
    padding: 0 3rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    z-index: 10;
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity: 1;
    pointer-events: auto;
}

/* Auto-hide controls and cursor after 2s of inactivity (Mouse / TV pointer) */
body.user-idle {
    cursor: none !important;
}

body.user-idle * {
    cursor: none !important;
}

body.user-idle .bottom-bar {
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
}

.actions-group {
    display: flex;
    align-items: center;
    gap: 0.65rem;
}

.icon-action-btn {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    padding: 0.4rem 0.55rem;
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
}

.icon-action-btn:hover {
    color: var(--promo-red);
    border-color: var(--promo-red);
    background: rgba(223, 38, 53, 0.04);
}

/* ==========================================================================
   MINIMAL DATE PICKER MODAL
   ========================================================================== */
.settings-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
}

.settings-modal.active {
    opacity: 1;
    pointer-events: auto;
}

.modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 13, 0.3);
    backdrop-filter: blur(4px);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}

.modal-backdrop.active {
    opacity: 1;
    pointer-events: auto;
}

.modal-box {
    background: #111115;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    width: 360px;
    max-width: 90vw;
    padding: 1.5rem;
    z-index: 1001;
    transform: scale(0.96);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.settings-modal.active .modal-box {
    transform: scale(1);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
}

.modal-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.1em;
}

.close-x {
    background: transparent;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    color: var(--text-muted);
}

.close-x:hover {
    color: #ffffff;
}

.modal-body {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.date-input {
    width: 100%;
    padding: 0.65rem 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    outline: none;
    color: #ffffff;
    background: #18181f;
}

.date-input:focus {
    border-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
}

.quick-chips {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.chip-btn {
    background: #18181f;
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 0.3rem 0.6rem;
    font-size: 0.7rem;
    font-family: var(--font-mono);
    border-radius: 4px;
    cursor: pointer;
    color: #ffffff;
    transition: all 0.15s ease;
}

.chip-btn:hover {
    border-color: #ffffff;
    background: #252530;
}

.modal-footer {
    display: flex;
    gap: 0.65rem;
}

.btn-primary {
    flex: 1;
    background: #ffffff;
    color: #000000;
    border: none;
    padding: 0.65rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.15s ease;
}

.btn-primary:hover {
    opacity: 0.9;
}

.btn-ghost {
    background: #18181f;
    color: var(--text-muted);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 0.65rem 0.9rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    cursor: pointer;
}

.btn-ghost:hover {
    color: #ffffff;
    background: #252530;
}

/* ==========================================================================
   RESPONSIVE LAYOUT
   ========================================================================== */
@media (max-width: 900px) {
    .monolith-body {
        padding: 1.5rem;
        height: auto;
        min-height: 100vh;
    }
    .bottom-bar {
        position: static;
        margin-top: 2rem;
        padding: 0;
    }
    .countdown-monolith {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-gap: 2rem 1.5rem;
        align-items: center;
        justify-items: center;
    }
    .colon-cell {
        display: none; /* Hide colons in 2x2 grid on mobile */
    }
    .digit-cell {
        height: clamp(65px, 16vw, 110px);
    }
}

@media (max-width: 500px) {
    .char-cell {
        height: clamp(20px, 5.5vw, 28px);
        width: calc(clamp(20px, 5.5vw, 28px) * var(--digit-aspect-ratio));
    }
    .morph-logo {
        --logo-h: clamp(20px, 5.5vw, 28px);
    }
    .word-spacer {
        width: clamp(10px, 2.5vw, 16px);
    }
    .countdown-monolith {
        grid-gap: 1.75rem 1rem;
    }
}

                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="settings-modal" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-label">TARGET DATE // INTEGRATION WEEK</span>
                <button id="closeModalBtn" class="close-x">✕</button>
            </div>
            <div class="modal-body">
                <input type="datetime-local" id="targetDateTimeInput" class="date-input">
                <div class="quick-chips">
                    <button type="button" class="chip-btn" data-days="3">+3 Days</button>
                    <button type="button" class="chip-btn" data-days="7">+7 Days</button>
                    <button type="button" class="chip-btn" data-preset="nov2026">02 Nov 2026</button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveDateBtn" class="btn-primary">SAVE</button>
                <button id="resetDateBtn" class="btn-ghost">DEFAULT</button>
            </div>
        </div>
    </div>
    <div id="modalBackdrop" class="modal-backdrop"></div>

    <script>
/**
 * 1337 TÉTOUAN — PROMO 2026
 * Pure Minimalist Monolith Countdown
 * Upper-left 1337/2026 tumbler morphing + Centered monolithic countdown
 */

(() => {
    'use strict';

    // --- 1337 Vector Glyphs (Updated Grid: viewBox ~120.67 199.37) ---
    const DIGIT_DATA = {
        0: { viewBox: '0 0 120.66 199.37', body: '<path d="M0,0v199.37h120.66V0H0ZM92.42,176.06H28.24V23.3s64.19,0,64.19,0v152.76Z"/>' },
        1: { viewBox: '0 0 118.11 199.36', body: '<path id="path-1" d="M28.24,176.06h30.81V23.3H23.11v31.07H0V0h87.3v176.06h30.81v23.3H28.24v-23.3Z"/>' },
        2: { viewBox: '0 0 120.68 199.36', body: '<polygon points="120.68 0 120.68 108.75 28.25 108.75 28.25 176.06 120.68 176.06 120.68 199.36 0 199.36 0 85.44 92.43 85.44 92.43 23.3 0 23.3 0 0 120.68 0"/>' },
        3: { viewBox: '0 0 120.67 199.36', body: '<path id="path-3" d="M0,176.06h92.43v-67.32H7.7v-23.3h84.73V23.3H0V0h120.67v199.36H0v-23.3Z"/>' },
        4: { viewBox: '0 0 120.67 199.37', body: '<polygon points="120.67 0 120.67 199.37 92.43 199.37 92.43 108.75 0 108.75 0 0 28.24 0 28.24 85.44 92.43 85.44 92.43 0 120.67 0"/>' },
        5: { viewBox: '0 0 120.68 199.36', body: '<polygon points="0 0 0 108.75 92.43 108.75 92.43 176.06 0 176.06 0 199.36 120.68 199.36 120.68 85.44 28.25 85.44 28.25 23.3 120.68 23.3 120.68 0 0 0"/>' },
        6: { viewBox: '0 0 120.67 199.37', body: '<path d="M120.67,23.3V0H0v199.37h120.67v-113.92H28.24V23.3h92.43ZM92.43,108.75v67.32H28.24v-67.32h64.19Z"/>' },
        7: { viewBox: '0 0 125.81 199.36', body: '<path id="path-4" d="M100.13,23.3H23.11v49.19H0V0h125.81v199.36h-25.68V23.3Z"/>' },
        8: { viewBox: '0 0 120.66 199.37', body: '<path d="M0,0v199.37h120.66V0H0ZM92.42,176.06H28.24v-67.32h64.18v67.32ZM92.43,85.44H28.23V23.3h64.19v62.14Z"/>' },
        9: { viewBox: '0 0 120.67 199.37', body: '<path d="M0,0v108.75h92.43v67.32H0v23.3h120.67V0H0ZM92.43,85.44H28.24V23.3h64.19v62.14Z"/>' }
    };

    function createDigitSvg(digit) {
        const item = DIGIT_DATA[digit] || DIGIT_DATA[0];
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', item.viewBox);
        svg.innerHTML = item.body;
        return svg;
    }

    // --- App Config & State ---
    const STORAGE_KEY = '1337_integration_target_date_monolith';
    const DEFAULT_TARGET = '2026-11-02T09:00:00';

    let targetTimestamp = getStoredTarget();
    let currentCountdownDigits = {
        d0: null, d1: null,
        h0: null, h1: null,
        m0: null, m1: null,
        s0: null, s1: null
    };

    function getStoredTarget() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            const parsed = new Date(stored).getTime();
            if (!isNaN(parsed)) return parsed;
        }
        return new Date(DEFAULT_TARGET).getTime();
    }

    function saveTarget(isoString) {
        localStorage.setItem(STORAGE_KEY, isoString);
        targetTimestamp = new Date(isoString).getTime();
        updateTargetDisplay();
    }

    // --- DOM Elements ---
    const countdownCells = {
        d0: document.getElementById('d0'),
        d1: document.getElementById('d1'),
        h0: document.getElementById('h0'),
        h1: document.getElementById('h1'),
        m0: document.getElementById('m0'),
        m1: document.getElementById('m1'),
        s0: document.getElementById('s0'),
        s1: document.getElementById('s1')
    };

    const morphSlots = [
        document.getElementById('slot0'),
        document.getElementById('slot1'),
        document.getElementById('slot2'),
        document.getElementById('slot3')
    ];

    const targetDisplay = document.getElementById('targetDateDisplay');
    const configBtn = document.getElementById('configToggleBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const targetInput = document.getElementById('targetDateTimeInput');
    const saveDateBtn = document.getElementById('saveDateBtn');
    const resetDateBtn = document.getElementById('resetDateBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const chipBtns = document.querySelectorAll('.chip-btn');

    // --- Target Date Formatter ---
    function updateTargetDisplay() {
        if (!targetDisplay) return;
        const d = new Date(targetTimestamp);
        const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        targetDisplay.textContent = `${d.toLocaleDateString('en-US', options).toUpperCase()} // 1337`;
    }

    // ==========================================================================
    // 1. UPPER-LEFT 1337 MORPHING LOGO
    // Cycles every 5 seconds: 1337 <--> 2026
    // Each column picks 'up' or 'down' and tumbles through random numbers
    // ==========================================================================
    const LOGO_STATES = {
        A: ['1', '3', '3', '7'],
        B: ['2', '0', '2', '6']
    };

    let currentLogoTarget = 'B'; // Next target will be 2026
    let currentLogoDigits = [...LOGO_STATES.A];
    let isMorphing = false;

    // Initialize initial static 1337
    function initMorphLogo() {
        morphSlots.forEach((slot, idx) => {
            if (!slot) return;
            slot.innerHTML = '';
            const digitWrap = document.createElement('div');
            digitWrap.className = 'morph-digit current';
            digitWrap.appendChild(createDigitSvg(currentLogoDigits[idx]));
            slot.appendChild(digitWrap);
        });

        // Trigger morph every 5 seconds
        setInterval(triggerLogoMorph, 5000);
    }

    function triggerLogoMorph() {
        if (isMorphing) return;
        isMorphing = true;

        const targetDigits = currentLogoTarget === 'B' ? LOGO_STATES.B : LOGO_STATES.A;

        morphSlots.forEach((slot, colIdx) => {
            if (!slot) return;

            // Randomize direction: 'up' or 'down'
            const direction = Math.random() > 0.5 ? 'up' : 'down';
            
            // Number of tumbling spins before settling (4 to 7 spins)
            const spinsCount = 4 + colIdx;
            let currentSpin = 0;

            function runSpin() {
                currentSpin++;
                const isFinal = currentSpin >= spinsCount;
                const nextDigit = isFinal ? targetDigits[colIdx] : String(Math.floor(Math.random() * 10));

                const currentEl = slot.querySelector('.morph-digit.current');
                
                // Create incoming element
                const incomingEl = document.createElement('div');
                incomingEl.className = `morph-digit ${direction === 'up' ? 'enter-up' : 'enter-down'}`;
                incomingEl.appendChild(createDigitSvg(nextDigit));
                slot.appendChild(incomingEl);

                // Force reflow
                void incomingEl.offsetWidth;

                // Animate out current
                if (currentEl) {
                    currentEl.className = `morph-digit ${direction === 'up' ? 'exit-up' : 'exit-down'}`;
                    setTimeout(() => currentEl.remove(), 260);
                }

                // Animate in incoming
                incomingEl.className = 'morph-digit current';

                if (!isFinal) {
                    // Quick tumbler step delay (approx 90ms - 130ms)
                    setTimeout(runSpin, 85 + Math.random() * 40);
                } else {
                    currentLogoDigits[colIdx] = targetDigits[colIdx];
                    if (colIdx === morphSlots.length - 1) {
                        isMorphing = false;
                        currentLogoTarget = currentLogoTarget === 'B' ? 'A' : 'B';
                    }
                }
            }

            // Slight stagger between columns for split-flap / cipher reel feel
            setTimeout(runSpin, colIdx * 75);
        });
    }

    // ==========================================================================
    // 2. CENTER SUSPENSEFUL COUNTDOWN ENGINE
    // Smooth vertical sliding transitions on digit change
    // ==========================================================================
    function updateDigitCell(cellKey, newDigit) {
        const cell = countdownCells[cellKey];
        if (!cell) return;

        const oldDigit = currentCountdownDigits[cellKey];
        if (oldDigit === newDigit && cell.children.length > 0) return;

        currentCountdownDigits[cellKey] = newDigit;

        const currentWrap = cell.querySelector('.digit-slide-wrap.active');

        // Initial populate without slide animation
        if (!currentWrap) {
            cell.innerHTML = '';
            const newWrap = document.createElement('div');
            newWrap.className = 'digit-slide-wrap active';
            newWrap.appendChild(createDigitSvg(newDigit));
            cell.appendChild(newWrap);
            return;
        }

        // Sliding transition: old goes up, new comes from bottom
        const incomingWrap = document.createElement('div');
        incomingWrap.className = 'digit-slide-wrap entering';
        incomingWrap.appendChild(createDigitSvg(newDigit));
        cell.appendChild(incomingWrap);

        // Force reflow
        void incomingWrap.offsetWidth;

        currentWrap.className = 'digit-slide-wrap leaving';
        incomingWrap.className = 'digit-slide-wrap active';

        setTimeout(() => {
            currentWrap.remove();
        }, 240);
    }

    function tickCountdown() {
        const now = Date.now();
        const diff = Math.max(0, targetTimestamp - now);

        const totalSecs = Math.floor(diff / 1000);
        const days = Math.floor(totalSecs / (3600 * 24));
        const hours = Math.floor((totalSecs % (3600 * 24)) / 3600);
        const minutes = Math.floor((totalSecs % 3600) / 60);
        const seconds = Math.floor(totalSecs % 60);

        const daysStr = String(days).padStart(2, '0');
        const hoursStr = String(hours).padStart(2, '0');
        const minsStr = String(minutes).padStart(2, '0');
        const secsStr = String(seconds).padStart(2, '0');

        updateDigitCell('d0', daysStr[0]);
        updateDigitCell('d1', daysStr[1]);

        updateDigitCell('h0', hoursStr[0]);
        updateDigitCell('h1', hoursStr[1]);

        updateDigitCell('m0', minsStr[0]);
        updateDigitCell('m1', minsStr[1]);

        updateDigitCell('s0', secsStr[0]);
        updateDigitCell('s1', secsStr[1]);
    }

    // ==========================================================================
    // 3. SETTINGS MODAL & ACTIONS
    // ==========================================================================
    function setupModal() {
        if (!configBtn || !settingsModal) return;

        const openModal = () => {
            const d = new Date(targetTimestamp);
            const localIso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            if (targetInput) targetInput.value = localIso;

            settingsModal.classList.add('active');
            if (modalBackdrop) modalBackdrop.classList.add('active');
        };

        const closeModal = () => {
            settingsModal.classList.remove('active');
            if (modalBackdrop) modalBackdrop.classList.remove('active');
        };

        configBtn.addEventListener('click', openModal);
        if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
        if (modalBackdrop) modalBackdrop.addEventListener('click', closeModal);

        if (chipBtns) {
            chipBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const days = btn.getAttribute('data-days');
                    const preset = btn.getAttribute('data-preset');
                    let target;
                    if (preset === 'nov2026') {
                        target = new Date(DEFAULT_TARGET);
                    } else if (days) {
                        target = new Date();
                        target.setDate(target.getDate() + parseInt(days, 10));
                        target.setHours(9, 0, 0, 0);
                    }
                    if (target && targetInput) {
                        const localIso = new Date(target.getTime() - target.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                        targetInput.value = localIso;
                    }
                });
            });
        }

        if (saveDateBtn) {
            saveDateBtn.addEventListener('click', () => {
                if (targetInput && targetInput.value) {
                    saveTarget(targetInput.value);
                    tickCountdown();
                }
                closeModal();
            });
        }

        if (resetDateBtn) {
            resetDateBtn.addEventListener('click', () => {
                localStorage.removeItem(STORAGE_KEY);
                targetTimestamp = new Date(DEFAULT_TARGET).getTime();
                updateTargetDisplay();
                tickCountdown();
                closeModal();
            });
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });
        }
    }

    // ==========================================================================
    // 4. FALLING BINARY STREAM ANIMATION (RED #df2635 ON WHITE)
    // ==========================================================================
    class BinaryRain {
        constructor(canvas) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.fontSize = 17;
            this.columns = [];
            this.dpr = window.devicePixelRatio || 1;

            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.animate();
        }

        resize() {
            this.dpr = window.devicePixelRatio || 1;
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.canvas.width = this.width * this.dpr;
            this.canvas.height = this.height * this.dpr;
            this.ctx.setTransform(1, 0, 0, 1, 0, 0);
            this.ctx.scale(this.dpr, this.dpr);

            const colWidth = 22;
            const totalCols = Math.floor(this.width / colWidth);
            this.columns = [];

            for (let i = 0; i < totalCols; i++) {
                this.columns.push(this.createColumn(i * colWidth, true));
            }
        }

        createColumn(x, isInitial = false) {
            const length = Math.floor(Math.random() * 12) + 8;
            const chars = [];
            for (let j = 0; j < length; j++) {
                chars.push(Math.random() > 0.5 ? '1' : '0');
            }
            // If page just loaded/refreshed, scatter streams across the entire screen
            const initialY = isInitial
                ? Math.random() * (this.height + 200)
                : -20 - Math.random() * 100;

            return {
                x,
                y: initialY,
                speed: 1.4 + Math.random() * 2.2,
                length,
                chars,
                opacity: 0.08 + Math.random() * 0.14
            };
        }

        animate() {
            this.ctx.clearRect(0, 0, this.width, this.height);
            this.ctx.font = `600 ${this.fontSize}px 'JetBrains Mono', monospace`;
            this.ctx.textAlign = 'center';

            const rowHeight = this.fontSize * 1.35;

            for (let i = 0; i < this.columns.length; i++) {
                const col = this.columns[i];
                col.y += col.speed;

                // Random bit flip in the falling stream
                if (Math.random() > 0.85) {
                    const randIdx = Math.floor(Math.random() * col.chars.length);
                    col.chars[randIdx] = Math.random() > 0.5 ? '1' : '0';
                }

                // Render characters in the trail
                for (let j = 0; j < col.length; j++) {
                    const charY = col.y - (j * rowHeight);
                    if (charY > -rowHeight && charY < this.height + rowHeight) {
                        const progress = j / col.length;

                        if (j === 0) {
                            // Head of stream: subtle white glow
                            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                            this.ctx.shadowColor = 'rgba(255, 255, 255, 0.25)';
                            this.ctx.shadowBlur = 4;
                        } else {
                            // Trail: smoothly fading white
                            const alpha = (1 - progress) * col.opacity;
                            this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
                            this.ctx.shadowBlur = 0;
                        }

                        this.ctx.fillText(col.chars[j], col.x + 11, charY);
                    }
                }
                this.ctx.shadowBlur = 0;

                // Reset column when it reaches past bottom
                if (col.y - (col.length * rowHeight) > this.height) {
                    this.columns[i] = this.createColumn(col.x, false);
                }
            }

            requestAnimationFrame(() => this.animate());
        }
    }

    // ==========================================================================
    // 5. INACTIVITY DETECTOR (AUTOHIDE CONTROLS & CURSOR AFTER 2 SECONDS)
    // ==========================================================================
    function setupIdleDetector() {
        let idleTimer = null;
        const IDLE_TIMEOUT_MS = 2000;

        function resetIdleTimer() {
            if (settingsModal && settingsModal.classList.contains('active')) {
                document.body.classList.remove('user-idle');
                return;
            }

            document.body.classList.remove('user-idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!settingsModal || !settingsModal.classList.contains('active')) {
                    document.body.classList.add('user-idle');
                }
            }, IDLE_TIMEOUT_MS);
        }

        const events = ['mousemove', 'mousedown', 'pointermove', 'pointerdown', 'touchstart', 'keydown', 'wheel'];
        events.forEach(evt => {
            window.addEventListener(evt, resetIdleTimer, { passive: true });
        });

        resetIdleTimer();
    }

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
        updateTargetDisplay();
        initMorphLogo();
        setupModal();
        setupIdleDetector();

        // Initialize Falling Binary Background Animation
        const binaryCanvas = document.getElementById('binaryCanvas');
        if (binaryCanvas) {
            new BinaryRain(binaryCanvas);
        }

        tickCountdown();
        setInterval(tickCountdown, 250); // Checks 4x per second to guarantee exact zero-latency second alignment
    });

})();

    </script>
